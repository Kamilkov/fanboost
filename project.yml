# FanBoost — XcodeGen project source. Regenerate with: xcodegen generate
name: FanBoost
options:
  bundleIdPrefix: com.kamilkovac
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
packages:
  # Sparkle 2 (current stable pinned by Package.resolved). NEVER link the
  # vendored Sparkle 1 copy under vendor/smcFanControl.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.6"
settings:
  base:
    APP_BUNDLE_ID: com.kamilkovac.FanBoost
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: 1.1.0
    CURRENT_PROJECT_VERSION: 2
    # Hardened Runtime with library validation on both targets and NO
    # DYLD/library-validation exception entitlements — this is what stops a
    # local process injecting into the pinned app identity.
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    # Signing style/identity per configuration; DEVELOPMENT_TEAM and
    # FB_IDENTITY_CLASS feed each binary's embedded XPC requirement, making
    # Debug and Release non-interchangeable. Both identities carry
    # OU=JXGJ4K9KR9 (the parenthesized id in an Apple Development cert's CN is
    # a personal id, NOT the team).
    Debug:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: Apple Development
      DEVELOPMENT_TEAM: JXGJ4K9KR9
      FB_IDENTITY_CLASS: apple-development
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: Developer ID Application
      DEVELOPMENT_TEAM: JXGJ4K9KR9
      FB_IDENTITY_CLASS: developer-id
      # Notarization requires a secure timestamp and forbids the debug
      # get-task-allow entitlement — enable the timestamp and stop injecting
      # base debug entitlements for the distribution build.
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  FanBoostHelper:
    type: tool
    platform: macOS
    sources:
      - path: FanBoostHelper
        excludes:
          - com.kamilkovac.FanBoostHelper.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kamilkovac.FanBoostHelper
        SWIFT_OBJC_BRIDGING_HEADER: FanBoostHelper/FanBoostHelper-Bridging-Header.h
        OTHER_CFLAGS: -DFANBOOST_NO_MAIN -DCMD_TOOL_BUILD
        SKIP_INSTALL: true
        # Embed the Info.plist into the tool binary so BuildConfig can read
        # FBAppBundleID/FBTeamID via Bundle.main — clean-clone-safe, no
        # generated source files.
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
    info:
      path: FanBoostHelper/Info.plist
      properties:
        FBAppBundleID: $(APP_BUNDLE_ID)
        FBTeamID: $(DEVELOPMENT_TEAM)
        FBIdentityClass: $(FB_IDENTITY_CLASS)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
  FanBoost:
    type: application
    platform: macOS
    sources:
      - path: FanBoost
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
    info:
      path: FanBoost/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: FanBoost
        NSHumanReadableCopyright: "© Kamil Kovac — GPL-2.0"
        # Same per-config keys as the helper, so the app builds the symmetric
        # requirement that pins the helper (defense in depth, both directions).
        FBTeamID: $(DEVELOPMENT_TEAM)
        FBIdentityClass: $(FB_IDENTITY_CLASS)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://raw.githubusercontent.com/Kamilkov/fanboost/main/appcast.xml
        # Public half only; the EdDSA private key lives solely in the login
        # Keychain of the release Mac (Sparkle generate_keys).
        SUPublicEDKey: antWOJdJaI860Q4DofY+u+mp9bOMSrqeStfx2jROeaA=
    dependencies:
      - target: FanBoostHelper
        embed: false
      - package: Sparkle
    postBuildScripts:
      # Apple SMAppService bundle layout: helper executable in Contents/MacOS,
      # daemon plist in Contents/Library/LaunchDaemons (matches BundleProgram).
      - name: Embed FanBoostHelper
        script: |
          APP="$BUILT_PRODUCTS_DIR/$WRAPPER_NAME"
          mkdir -p "$APP/Contents/Library/LaunchDaemons"
          cp "$BUILT_PRODUCTS_DIR/FanBoostHelper" "$APP/Contents/MacOS/FanBoostHelper"
          cp "$SRCROOT/FanBoostHelper/com.kamilkovac.FanBoostHelper.plist" \
             "$APP/Contents/Library/LaunchDaemons/"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/FanBoostHelper
          - $(SRCROOT)/FanBoostHelper/com.kamilkovac.FanBoostHelper.plist
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(WRAPPER_NAME)/Contents/MacOS/FanBoostHelper
          - $(BUILT_PRODUCTS_DIR)/$(WRAPPER_NAME)/Contents/Library/LaunchDaemons/com.kamilkovac.FanBoostHelper.plist
      # Xcode's Embed & Sign re-signs Sparkle.framework itself but leaves its
      # nested executables ad-hoc, which notarization rejects. Re-sign them
      # per Sparkle's official manual-signing guidance, innermost first, with
      # the Release Developer ID + hardened runtime + timestamp; Downloader.xpc
      # keeps its entitlements (--preserve-metadata=entitlements). The listed
      # paths are intentionally coupled to Sparkle 2.9.6's official layout —
      # revisit them together with any Sparkle version bump. The product
      # CodeSign phase then re-seals the app.
      - name: Re-sign Sparkle nested code (Release)
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            FW="$BUILT_PRODUCTS_DIR/$WRAPPER_NAME/Contents/Frameworks/Sparkle.framework"
            codesign -f -o runtime --timestamp -s "$EXPANDED_CODE_SIGN_IDENTITY" --preserve-metadata=entitlements "$FW/Versions/B/XPCServices/Downloader.xpc"
            codesign -f -o runtime --timestamp -s "$EXPANDED_CODE_SIGN_IDENTITY" "$FW/Versions/B/XPCServices/Installer.xpc"
            codesign -f -o runtime --timestamp -s "$EXPANDED_CODE_SIGN_IDENTITY" "$FW/Versions/B/Autoupdate"
            codesign -f -o runtime --timestamp -s "$EXPANDED_CODE_SIGN_IDENTITY" "$FW/Versions/B/Updater.app"
            codesign -f -o runtime --timestamp -s "$EXPANDED_CODE_SIGN_IDENTITY" "$FW"
          fi
